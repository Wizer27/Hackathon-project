# nginx занимает порт 80, поэтому проверки Let's Encrypt для сайта игры он пересылает в Caddy (порт 48080).
# Остальные сайты nginx не затрагиваются. Замените skazka.example.com на свой домен:
#   sudo cp deploy/nginx-acme.conf /etc/nginx/conf.d/skazka-acme.conf && sudo nginx -t && sudo systemctl reload nginx
server {
	listen 80;
	server_name skazka.example.com;

	location /.well-known/acme-challenge/ {
		proxy_pass http://127.0.0.1:48080;
		proxy_set_header Host $host;
	}

	location / {
		return 301 https://$host:48443$request_uri;
	}
}
